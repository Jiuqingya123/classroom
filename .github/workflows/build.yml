name: build-installers

# 手动触发或打 tag 时，在 macOS / Windows 两个 runner 上各出一份安装包。
# macOS 的 dmg 只能在 macOS 上产出，Windows 的 nsis exe 只能在 Windows 上产出，
# 所以这里必须两个 job 并行，不能指望一台机器出两端。

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  mac:
    runs-on: macos-14 # Apple Silicon，可同时交叉出 x64 包
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 类型检查
        run: npm run typecheck

      # 配了证书就自动走正式签名 + 公证；没配则 electron-builder.yml 里的 identity:'-' 生效（ad-hoc）
      - name: 打包 macOS
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run dist:mac

      - uses: actions/upload-artifact@v4
        with:
          name: ClassRoom-macOS
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 打包 Windows
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: ClassRoom-Windows
          path: apps/desktop/dist/*.exe
          if-no-files-found: error
